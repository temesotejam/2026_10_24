name: Update reality news

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - scripts/fetch-news.mjs
      - .github/workflows/news.yml

permissions:
  contents: write

concurrency:
  group: reality-news
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch public news feeds
        run: node scripts/fetch-news.mjs
      - name: Commit updated feed
        run: |
          if git diff --quiet -- data/news.json; then
            echo "No feed changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "Update automatic news feed"
          git push
